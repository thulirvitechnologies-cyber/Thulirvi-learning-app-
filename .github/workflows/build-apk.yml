
name: Build Thulirvi Learning APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Thulirvi_Learning_App_Project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q Thulirvi_Learning_App_Project.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: Thulirvi_Learning_App_Project
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Thulirvi-Learning-APK
          path: Thulirvi_Learning_App_Project/app/build/outputs/apk/debug/app-debug.apk
          
